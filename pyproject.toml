[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "grain-stt"
version = "0.1.0"
description = "Grain STT — Voice transcription with smart provider routing"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11.0",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5",
    "httpx>=0.27.0",
    "keyring>=25.2.1",
    "platformdirs>=4.2.2",
    "numpy>=1.24.0",
]

[project.scripts]
grain-stt = "open_voice_router.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_voice_router*"]

[tool.setuptools.package-data]
"open_voice_router" = [
    "ui/**/*.qml",
    "local_asr/server.py",
    "local_asr/requirements.txt",
]
